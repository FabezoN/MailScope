name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build global
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  ci-frontend:
    name: CI Frontend React/Vite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter front lint

      - name: Build
        run: pnpm --filter front build

  ci-job-runner:
    name: CI Job Runner
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @mailscope/job-runner lint

      - name: Build
        run: pnpm --filter @mailscope/job-runner build

  ci-osint:
    name: CI OSINT Service
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @mailscope/osint-service lint

      - name: Build
        run: pnpm --filter @mailscope/osint-service build

  ci-api:
    name: CI API
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          echo "DATABASE_HOST=db" >> .env
          echo "DATABASE_PORT=5432" >> .env
          echo "DATABASE_USER=mailscope" >> .env
          echo "DATABASE_PASSWORD=mailscope" >> .env
          echo "DATABASE_NAME=mailscope" >> .env
          echo "NODE_ENV=development" >> .env
          echo "API_PORT=3000" >> .env
          echo "JWT_SECRET=ci-secret-not-for-production" >> .env
          echo "OSINT_SERVICE_PORT=3001" >> .env
          echo "OSINT_SERVICE_URL=http://osint-service-dev:3001" >> .env

      - name: Build and start containers
        run: docker compose up --build -d

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/v1/auth/login -X POST -H "Content-Type: application/json" -d '{}')
            if [ "$STATUS" = "400" ] || [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "✅ Gateway is ready (HTTP $STATUS)"
              exit 0
            fi
            echo "Waiting for gateway... ($i/30) [HTTP $STATUS]"
            sleep 2
          done
          echo "❌ Gateway did not start in time"
          docker compose logs gateway-dev
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
