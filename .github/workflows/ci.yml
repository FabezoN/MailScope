name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build global
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  ci-frontend:
    name: CI Frontend React/Vite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter front lint

      - name: Build
        run: pnpm --filter front build

      - name: Test
        run: pnpm --filter front test

  ci-auth-service:
    name: CI Auth Service
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @mailscope/auth-service lint

      - name: Build
        run: pnpm --filter @mailscope/auth-service build

      - name: Test
        run: pnpm --filter @mailscope/auth-service test

  ci-gateway:
    name: CI Gateway
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @mailscope/gateway lint

      - name: Build
        run: pnpm --filter @mailscope/gateway build

      - name: Test
        run: pnpm --filter @mailscope/gateway test

  ci-investigations-service:
    name: CI Investigations Service
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @mailscope/investigations-service test

  ci-job-runner:
    name: CI Job Runner
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @mailscope/job-runner lint

      - name: Build
        run: pnpm --filter @mailscope/job-runner build

      - name: Test
        run: pnpm --filter @mailscope/job-runner test

  ci-osint:
    name: CI OSINT Service
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @mailscope/osint-service lint

      - name: Build
        run: pnpm --filter @mailscope/osint-service build

      - name: Test
        run: pnpm --filter @mailscope/osint-service test

  ci-api:
    name: CI API
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          echo "DATABASE_HOST=db" >> .env
          echo "DATABASE_PORT=5432" >> .env
          echo "DATABASE_USER=mailscope" >> .env
          echo "DATABASE_PASSWORD=mailscope" >> .env
          echo "DATABASE_NAME=mailscope" >> .env
          echo "NODE_ENV=development" >> .env
          echo "API_PORT=3000" >> .env
          echo "JWT_SECRET=ci-secret-not-for-production" >> .env
          echo "AUTH_SERVICE_PORT=3002" >> .env
          echo "AUTH_SERVICE_URL=http://auth-service-dev:3002" >> .env
          echo "AUTH_DATABASE_NAME=mailscope_auth" >> .env
          echo "INVESTIGATIONS_SERVICE_PORT=3003" >> .env
          echo "INVESTIGATIONS_SERVICE_URL=http://investigations-service-dev:3003" >> .env
          echo "INVESTIGATIONS_DATABASE_NAME=mailscope_investigations" >> .env
          echo "OSINT_SERVICE_PORT=3001" >> .env
          echo "OSINT_SERVICE_URL=http://osint-service-dev:3001" >> .env

      - name: Build and start containers
        run: docker compose up --build -d

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:3000/api/v1/auth/login \
              -X POST -H "Content-Type: application/json" -d '{}' || echo "000")
            if [ "$STATUS" = "400" ] || [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "✅ Gateway is ready (HTTP $STATUS)"
              exit 0
            fi
            echo "Waiting for gateway... ($i/30) [HTTP $STATUS]"
            sleep 2
          done
          echo "❌ Gateway did not start in time"
          docker compose logs gateway-dev
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
