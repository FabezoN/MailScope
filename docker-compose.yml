services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-dev:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file: .env
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  api-build:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - build

  front-dev:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
      target: dev
    volumes:
      - ./apps/front/src:/app/apps/front/src
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000

  front-build:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
      target: prod
    ports:
      - "80:80"
    profiles:
      - build

  job-runner-dev:
    build:
      context: .
      dockerfile: apps/job-runner/Dockerfile
      target: dev
    volumes:
      - ./apps/job-runner/src:/app/apps/job-runner/src
      - ./packages:/app/packages

  job-runner-build:
    build:
      context: .
      dockerfile: apps/job-runner/Dockerfile
      target: build
    profiles:
      - build

volumes:
  postgres_data:
